[package]
name = "nix-your-shell"
version = "1.4.6"
edition = "2021"
authors = ["Rebecca Turner <rebeccat@mercury.com>"]
description = "A `nix` and `nix-shell` wrapper for shells other than `bash`"
repository = "https://github.com/MercuryTechnologies/nix-your-shell"
license = "MIT"
keywords = ["nix", "nixos", "nix-shell", "fish"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
calm_io = "0.1.1"
camino = "1.2.2"
clap = { version = "4.5.54", features = ["derive", "wrap_help", "env"] }
miette = { version = "7.6.0", features = ["fancy"] }
minijinja = { version = "2.14.0", features = ["json"] }
shell-words = "1.1.1"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "registry"] }

# generated by 'cargo dist init'
[profile.dist]
inherits = "release"
debug = true
split-debuginfo = "packed"

# See: https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
[package.metadata.release]
# Don't tag commits
tag = false
# Don't do `git push`
push = false
# Don't do `cargo publish`
publish = false
