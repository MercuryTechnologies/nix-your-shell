[package]
name = "test-harness-macro"
version = "0.1.0"
edition = "2021"

description = "`#[test]` attribute for `nix-your-shell`"

publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0.43"
syn = { version = "2.0.114", features = ["full"] }

[dev-dependencies]
tracing-test = "0.2.5"

# See: https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
[package.metadata.release]
release = false
